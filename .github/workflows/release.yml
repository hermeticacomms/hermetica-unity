# Push a tag matching "version" in package.json ("v0.1.0") to release. Unity's Package Manager installs straight from the git
# tag (https://github.com/hermeticacomms/hermetica-unity.git#v0.1.0); the attested tarball is the provenance record.
# OpenUPM (optional) picks up new tags by itself once the package is submitted at openupm.com.
name: release
on:
  push: { tags: ['v*'] }
permissions: { contents: write, id-token: write, attestations: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - run: dotnet test Tests~/Hermetica.Unity.Tests.csproj -c Release
      - run: git archive --prefix "com.hermeticacomms.hermetica/" -o "hermetica-unity-$GITHUB_REF_NAME.tgz" HEAD
      - uses: actions/attest-build-provenance@v3
        with: { subject-path: 'hermetica-unity-*.tgz' }
      - run: gh release create "$GITHUB_REF_NAME" hermetica-unity-*.tgz --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }
